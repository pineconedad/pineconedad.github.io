bio: |-
  I recently completed my undergraduate degree in Computer Science at [BRAC University](https://www.bracu.ac.bd/) in Bangladesh. Over those four years, I studied algorithms, data structures, theory of computation, bioinformatics, artificial intelligence, natural language processing, and quantum computing. My interests are still broad. I am looking at PhD opportunities where I can narrow them through actual research rather than pick a label too early.

  For my undergraduate thesis, supervised by Dr. [Swakkhar Shatabda](https://scholar.google.com/citations?user=2DhrWFgAAAAJ&hl=en) and Dr. [Farig Yousuf Sadeque](https://scholar.google.com/citations?user=ULNaeowAAAAJ&hl=en), I studied under-trained tokens in large language models. We asked why some vocabulary items still fail after pre-training and whether their representations can be repaired without damaging normal model behaviour.

  My interests are not limited to LLMs. I recently joined a NeurIPS 2026 competition organized by the Stanford Vision and Learning Lab. We did not place on the leaderboard, but our local-GPU setup and 4B-parameter vision-language model got much farther than I expected. I am also working on a project with vision encoders and will add details once the work is public.

  I also keep coming back to how computation works at a more basic level. I took two quantum-computing electives covering tensor products, circuits and algorithms, noise, error correction, and quantum information. I enjoyed the mathematics enough that quantum computing remains one of the directions I may pursue.

  My interests are still a little messy, and I am fine with that for now. I like difficult problems in AI systems and theoretical computer science. I currently work as a researcher at MIRAI Lab, University of Dhaka, under Dr. [Md. Mamun-Or-Rashid](https://scholar.google.com/citations?hl=en&user=OUanlWAAAAAJ).

